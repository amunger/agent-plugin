<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Customization update recommendation</title>
	<style>
		:root {
			color-scheme: light dark;
			font-family: var(--vscode-font-family, system-ui, sans-serif);
		}
		body {
			margin: 0;
			font-size: var(--vscode-font-size, 13px);
			color: var(--vscode-foreground, CanvasText);
			background: transparent;
		}
		.card {
			padding: 4px 0;
		}
		p {
			margin: 6px 0;
			line-height: 1.45;
		}
		dt {
			color: var(--vscode-descriptionForeground, GrayText);
		}
		dd {
			margin: 0;
			overflow-wrap: anywhere;
		}
		dl {
			display: grid;
			grid-template-columns: max-content minmax(0, 1fr);
			gap: 4px 10px;
			margin: 10px 0;
		}
		summary {
			cursor: pointer;
			line-height: 20px;
		}
		#proposed-change {
			white-space: pre-wrap;
			overflow-wrap: anywhere;
			margin-bottom: 10px;
		}
		button {
			padding: 6px 12px;
			border: 0;
			border-radius: 3px;
			color: var(--vscode-button-foreground, ButtonText);
			background: var(--vscode-button-background, ButtonFace);
			cursor: pointer;
		}
		button:hover {
			background: var(--vscode-button-hoverBackground, ButtonFace);
		}
		button:disabled {
			cursor: wait;
			opacity: 0.65;
		}
		.status {
			color: var(--vscode-descriptionForeground, GrayText);
			font-size: 0.9em;
		}
		.status:empty {
			display: none;
		}
	</style>
</head>
<body>
	<details id="card" class="card" hidden>
		<summary id="card-title">Customization update recommendation</summary>
		<dl>
			<dt id="subject-label">Skill / instruction</dt>
			<dd id="customization"></dd>
			<dt>Source plugin</dt>
			<dd id="source"></dd>
		</dl>
		<p id="proposed-change"></p>
		<button id="delegate" type="button" disabled>Delegate change</button>
	</details>
	<p id="status" class="status" role="status" aria-live="polite">Loading recommendation...</p>
	<script>/* APP_SCRIPT */</script>
</body>
</html>
