<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Verification plan</title>
	<style>
		:root { color-scheme: light dark; font-family: var(--vscode-font-family, system-ui, sans-serif); }
		body { margin: 0; color: var(--vscode-foreground, CanvasText); background: transparent; }
		section { padding: 12px; border: 1px solid var(--vscode-widget-border, GrayText); border-radius: var(--vscode-cornerRadius-medium, 6px); }
		h2 { margin: 0 0 8px; font-size: 1rem; }
		h3 { margin: 12px 0 4px; font-size: 0.9rem; }
		p, li { line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
		p { margin: 4px 0; }
		ul { padding-inline-start: 20px; margin: 8px 0; }
		#status { color: var(--vscode-descriptionForeground, GrayText); }
		button { margin-top: 12px; padding: 6px 12px; border: 1px solid var(--vscode-button-border, transparent); border-radius: var(--vscode-cornerRadius-small, 4px); color: var(--vscode-button-foreground, ButtonText); background: var(--vscode-button-background, ButtonFace); cursor: pointer; }
		button:hover { background: var(--vscode-button-hoverBackground, ButtonFace); }
		button:focus-visible { outline: 2px solid var(--vscode-focusBorder, Highlight); outline-offset: 2px; }
		button:disabled { opacity: 0.65; cursor: default; }
	</style>
</head>
<body>
	<section aria-labelledby="title">
		<h2 id="title">Verification plan</h2>
		<p id="summary"></p>
		<ul id="checks"></ul>
		<h3>Limits and readiness</h3>
		<p id="limitations"></p>
		<p id="status" role="status" aria-live="polite"></p>
		<button id="verify" type="button" disabled>Go Ahead and Verify</button>
	</section>
	<script>/* APP_SCRIPT */</script>
</body>
</html>
